name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write users config from secret
        env:
          USERS_TS: ${{ secrets.USERS_TS }}
        run: |
          if [ -z "$USERS_TS" ]; then
            echo "::error::Missing USERS_TS secret — refusing to build."
            echo "src/store/users.ts is gitignored, so the real accounts can only come from"
            echo "the USERS_TS secret. Add it under:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo "Name: USERS_TS"
            echo "Value: the full contents of your local src/store/users.ts"
            echo "(see src/store/users.example.ts for the expected shape)"
            exit 1
          fi
          printf '%s\n' "$USERS_TS" > src/store/users.ts
          echo "Wrote src/store/users.ts from the USERS_TS secret."

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
